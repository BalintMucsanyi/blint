  {{define "content"}}
  <h1>Recent Activities</h1>
  <ul>
  {{range .Activities}}
      <li>
        Date: {{.Date}}: Activity: {{.Name}} - Duration: {{.Duration}} - Intensity: {{.Effort}}
        <form method="POST" action="/activities/{{.ID}}/delete"
            onsubmit="return confirm('Delete this activity?')" style="display:inline">
            <button type="submit">✕</button>
        </form>
      </li>
  {{end}}
  </ul>
  <h2>Add Activity</h2>
  <form method="POST" action="/activities">
      <label for="date">date:</label><br>
      <input type="date" id="date" name="date" required><br>
      <label for="name">name:</label><br>
      <input type="text" id="name" name="name" required><br>
      <label for="duration">duration:</label><br>
      <input type="number" min="1" max="1000" id="duration" name="duration" required><br>
      <label for="effort">effort:</label><br>
      <input type="number" min="1" max="10" id="effort" name="effort" required><br>
      <input type="submit">
  </form>
  {{end}}
